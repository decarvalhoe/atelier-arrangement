[project]
name = "atelier-arrangement"
version = "0.1.0"
description = "Chaîne libre et scriptée pour arranger, produire du matériel d'orchestre et assembler des medleys"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["music21>=9", "verovio>=4", "pymupdf>=1.24", "mido>=1.3", "pyyaml>=6"]

[project.optional-dependencies]
audio = ["basic-pitch", "librosa"]
dev = ["pytest>=8"]

[project.scripts]
atelier = "atelier.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atelier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
