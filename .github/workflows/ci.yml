name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y lilypond
      - run: pip install -e ".[dev]"
      - run: python -m atelier env || true
      - run: python -m pytest -q
      - run: python -m atelier medley examples/medley-demi-heure.json
      - run: python -m atelier render lilypond examples/pont.ly --out work/out
      - uses: actions/upload-artifact@v4
        with: { name: pont-pdf, path: work/out/*.pdf }
